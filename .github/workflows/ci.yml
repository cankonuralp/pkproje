# CI + GitHub Pages önizlemesi (EKSIKLER 1; reisim 2026-09-23: "ilk yayını yap" → Pages önizlemesi).
# · Her push'ta: tip denetimi · lint · test (fail 0) · olumsuz kanıt · üretim derlemesi (biri düşerse iş durur) + uçtan uca üç genişlik, ayrı
#   işlerde aynı anda (2026-10-08).
# · main'e push'ta: denetim kalem dalında aynı commit'te geçmiştir (yalnız yeşil commit ileri sarılır); maket / sunum değiştiyse önizleme
#   kurulur ve Pages'e yayınlanır (2026-10-06). Site: maket ve sunum (docs/). Uygulamanın statik önizlemesi 2026-10-04'te kalktı (giriş / oturum sunucu ister).
# · Next.js anonim kullanım bildirimi kapalı (anayasa 5.2: üçüncü tarafa veri gitmez).
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# 2026-10-06 (reisim: "githubdan hala bir sürü gereksiz yayınlar da gidiyor onlarıda durdur"): aynı dala yeni push gelince eski koşu durur
# (yalnız son commit denetlenir); main'e yalnız kalem dalında denetimi YEŞİL geçmiş commit ileri sarılır → main'de denetim yeniden koşmaz,
# Pages yalnız maket / sunum değiştiyse ve o commit'in yeşil denetimi varsa yayınlanır.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  denetim:
    name: Denetim
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # 413: takılan iş 6 saatlik varsayılanı beklemesin (0f1ee47: tarayıcı kurulumunda 71 dk asılı kaldı); olağan süre 5–8 dk
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium testten ÖNCE (2026-10-05, 316): PDF motoru (src/belge/pdf.ts) npm test'te de basar; uçtan uca da aynısını kullanır
      # 413 devamı: sistem paketi (apt) KURULMAZ — eksik olanlar yalnız yazı tipleri (makinede kütüphaneler hazır; PDF Carlito'yu gömer). GitHub'ın
      # paket sunucusu yavaşlayınca kurulum dakikalarca sürüyor, yarıda kesilince kilit sonraki denemeyi de düşürüyordu (60547a0)
      - run: npx playwright install chromium
        timeout-minutes: 8
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:negatif
      - run: node scripts/next.ts build

  # uçtan uca (K0, 2026-10-03): masaüstü · tablet · telefon. 2026-10-06: her genişlik KENDİ sunucusu ve geçici veritabanıyla — tek geliştirme
  # sunucusu ~200 testin sonunda bellek eşiğine dayanıp kendini yeniden başlatıyor, o an koşan telefon testi düşüyordu (3dda074, 661004b,
  # c17ba55, ba4c79e); eşiği kapatınca sunucu çöktü (0059a80). Testler genişlik başına kendi verisini kurar (proje adıyla), birbirinin
  # verisine dayanmaz. 2026-10-08 (reisim: "1 saattir koşuyor bu deneme daha ne kadar sürecek ?"): art arda üç genişlik ~70 dk sürüyordu →
  # her genişlik AYRI işte, aynı anda (ayrı makine, kendi sunucusu — önceki yalıtımın aynısı). Geliştirme sunucusuyla koşar, derleme çıktısına
  # bağlı değil: denetimi beklemez. Biri düşse de ötekiler koşar (fail-fast kapalı); koşu yine kırmızı biter (yayın şartı bütün koşunun yeşili).
  # 355: düşen testin sayfa anlık görüntüsü (error-context.md) ve izi saklanır, 3 gün (uydurma veri). Günlükteki "Error Context" yolu buradaki dosyadır.
  # 434 (2026-10-09; a38d50a, 2658414): genişlik başına tek geliştirme sunucusunun belleği koşunun sonunda doluyordu — "JavaScript heap out of
  # memory" (12 GB sınırı), koşucu kapanıyor, son dosyalar (yönetim, zimmetler, tarama) düşüyordu. Her genişlik İKİ PARÇA (Playwright --shard,
  # dosya dosya): her parça kendi makinesinde, kendi taze sunucusu ve veritabanıyla (tohumlar spec başına ayrı — dosyalar birbirine dayanmaz),
  # yarı yük ve yarı sürede. Altı iş aynı anda. 2026-10-10: ÜÇ PARÇA — 467'den sonra (dokuz Bakanlık türü, büyüyen paketler) ikinci parçanın
  # sonundaki dosya (zimmetler) iki koşuda makine belleği bitince düştü ("frame detached", "browser has been closed"); dokuz iş aynı anda.
  uctan_uca:
    name: Uçtan uca (${{ matrix.proje }} ${{ matrix.parca }}/3)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # 413: olağan süre 19–26 dk (+ yavaş paket sunucusunda kurulum ~10 dk — 7ed6e25 telefon 34 dk); asılı kalan iş kesilir. 420: site taraması
    # (e2e/tarama.spec.ts) her sayfayı iki temada tarar — ölçüldü 5–7 dk (9cf7f54: iş 28–36 dk); sınır 50 dk
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        proje: [masaustu, tablet, telefon]
        parca: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 413: görsel karşılaştırmanın görüntüleri sistem yazı tipleriyle kaydedildi → paketler (--with-deps) burada kurulur. Yavaş paket sunucusunda
      # ~10 dk sürebilir (7ed6e25 telefon: 591 sn); asılı kalırsa 20 dk'da kesilir (yarıda kesilen kurulum kilit bıraktığından yeniden deneme yok)
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 20
      - id: e2e
        run: npm run test:e2e -- --project=${{ matrix.proje }} --shard=${{ matrix.parca }}/3
      - if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        # 411: görsel karşılaştırmanın o koşuda yazdığı (eksik ya da farklı) görüntüler de — yeni kayıt buradan alınır, gözden geçirilip commit'e girer
        with:
          name: "e2e-${{ matrix.proje }}-${{ matrix.parca }}"
          path: |
            test-results/
            e2e/goruntu/
          retention-days: 3
          if-no-files-found: ignore
      # 451: gözle bakılacak görüntüler (e2e-goz/ — ör. Format kurucunun kâğıdı ve belge önizlemesi) her koşuda; PC'de yerel sunucu yok, ekranı
      # buradan görürüz
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "goz-${{ matrix.proje }}-${{ matrix.parca }}"
          path: e2e-goz/
          retention-days: 3
          if-no-files-found: ignore

  # main: maket / sunum (Pages sitesinin kaynakları) değişti mi — değişmediyse yayın işi hiç açılmaz (boş Pages yayını yok)
  degisiklik:
    name: Pages kaynağı değişti mi
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      var: ${{ steps.bak.outputs.var }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: bak
        env:
          ONCE: ${{ github.event.before }}
        run: |
          if [ -z "$ONCE" ] || ! git cat-file -e "$ONCE^{commit}" 2>/dev/null; then echo "var=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet "$ONCE" "$GITHUB_SHA" -- docs tools/sunum-uret.mjs src/styles/tokens.css scripts/onizleme.ts scripts/onizleme-sun.ts; then
            echo "var=false" >> "$GITHUB_OUTPUT"
          else
            echo "var=true" >> "$GITHUB_OUTPUT"
          fi

  yayin:
    name: Pages önizlemesi
    needs: degisiklik
    if: github.ref == 'refs/heads/main' && needs.degisiklik.outputs.var == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # denetim geçmeden yayın yok: bu commit kalem dalında "Denetim"i yeşil geçmiş olmalı (aynı SHA'nın başarılı ci koşusu)
      - name: Commit'in yeşil denetimi var mı
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success&per_page=20" --jq '[.workflow_runs[] | select(.name == "ci" and .head_branch != "main")] | length')
          if [ "$n" = "0" ]; then echo "Bu commit'in yeşil denetimi yok; Pages yayınlanmaz."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/onizleme.ts
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: dagit
        uses: actions/deploy-pages@v5
