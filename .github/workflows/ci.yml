# CI + GitHub Pages önizlemesi (EKSIKLER 1; reisim 2026-09-23: "ilk yayını yap" → Pages önizlemesi).
# · Her push'ta: tip denetimi · lint · test (fail 0) · olumsuz kanıt · üretim derlemesi. Biri düşerse iş durur.
# · main'e push'ta ve denetim geçtiyse: önizleme kurulur (npm run build:onizleme — o da önce testi koşar) ve Pages'e
#   yayınlanır. Site: maket ve sunum (docs/). Uygulamanın statik önizlemesi 2026-10-04'te kalktı (giriş / oturum sunucu ister).
# · Next.js anonim kullanım bildirimi kapalı (anayasa 5.2: üçüncü tarafa veri gitmez).
name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  denetim:
    name: Denetim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium testten ÖNCE (2026-10-05, 316): PDF motoru (src/belge/pdf.ts) npm test'te de basar; uçtan uca da aynısını kullanır
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:negatif
      - id: derleme
        run: node scripts/next.ts build
      # uçtan uca (K0, 2026-10-03): masaüstü · tablet · telefon (Chromium yukarıda kuruldu). 2026-10-06: her genişlik KENDİ sunucusu ve
      # geçici veritabanıyla — tek geliştirme sunucusu ~200 testin sonunda bellek eşiğine dayanıp kendini yeniden başlatıyor, o an koşan
      # telefon testi düşüyordu (3dda074, 661004b, c17ba55, ba4c79e); eşiği kapatınca sunucu çöktü (0059a80). Testler genişlik başına kendi
      # verisini kurar (proje adıyla), birbirinin verisine dayanmaz. Biri düşse de öteki genişlikler koşar (iş yine kırmızı biter).
      - run: npm run test:e2e -- --project=masaustu
      - if: ${{ !cancelled() && steps.derleme.outcome == 'success' }}
        run: npm run test:e2e -- --project=tablet
      - if: ${{ !cancelled() && steps.derleme.outcome == 'success' }}
        run: npm run test:e2e -- --project=telefon

  yayin:
    name: Pages önizlemesi
    needs: denetim
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:onizleme
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: dagit
        uses: actions/deploy-pages@v5
