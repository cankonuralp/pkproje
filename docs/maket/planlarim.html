<!doctype html>

<head>

<title>Planlarım · probata maket</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../marka/favicon.svg" type="image/svg+xml">
<script>
  /* Tema çizimden ÖNCE uygulanır (yanıp sönme olmasın).
     Öncelik: adres (?tema=) → bu tarayıcıda seçilen → sistem tercihi. Birincil tuş rengi kararlı (A), seçenek yok. */
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement, t = q.get("tema");
    try { if (!t) t = localStorage.getItem("probata-tema"); } catch (e) {}
    if (t === "acik" || t === "koyu") d.setAttribute("data-tema", t);
    else d.setAttribute("data-tema", matchMedia("(prefers-color-scheme: dark)").matches ? "koyu" : "acik");
  })();
</script>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/maket.css">
</head>
<body>

        <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
      </button>
    </div>
    <nav class="a-menu">
      <a href="#/" aria-current="page">
        <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-calendar-check"/></svg>

      <a href="#"><svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-file-text"/></svg>Raporlarım</a>

  </aside>
  <div class="a-perde" data-eylem="cekmece-kapat"></div>

  <div class="a-govde">
    <header class="a-ust">
      <button class="a-menu-tus" type="button" data-eylem="cekmece-ac" aria-label="Menüyü aç" aria-controls="a-cubuk" aria-expanded="false">
        <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-menu"/></svg>

      <div class="a-firma">
        <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-building-2"/></svg>
        <span class="a-firma-ad" title="Kalkan Muayene Ltd.">Kalkan Muayene Ltd.</span>
      </div>
      <div class="a-ust-bosluk"></div>
      <button class="a-ikon-tus" type="button" data-eylem="tema" id="a-tema-tus" aria-label="Temayı değiştir">
        <svg class="a-ikon a-tema-ay" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-moon"/></svg>
        <svg class="a-ikon a-tema-gunes" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-sun"/></svg>

      </div>
    </header>

    <main class="a-icerik" id="a-icerik">
      <!-- GÖRÜNÜM 1 · liste (adres #/ ya da boş). GÖRÜNÜM 2 · plan içi (#/plan/<id>), maket.js planCiz() doldurur. -->
      <div id="a-liste-gorunum">
      <div class="a-sayfa-bas">
        <h1 tabindex="-1">Planlarım</h1>
        <span class="a-sayac" id="a-sayac" aria-live="polite"></span>
      </div>

      <!-- SÜZGEÇ (kalıp 15, reisim 2026-09-23 "kurallara göre düzenle"): TEK akış, kuralın sırasıyla —
           arama → durum çipleri → ve/veya → (boşluk) → seçiciler + Temizle sağda. Sığmayınca seçiciler + Temizle BİRLİKTE
           alt satıra sağa kayar (Temizle yalnız kalmaz). Telefon: arama + Süzgeç üstte, çipler yana kayar, seçiciler levhada. -->
      <div class="a-suzgec" id="a-suzgec">
        <label class="a-ara" id="a-ara">
          <span class="a-gizli">Planlarda ara</span>
          <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-search"/></svg>
          <input type="search" id="a-ara-girdi" placeholder="Proje, müşteri, il" autocomplete="off">
          <button class="a-ara-sil" type="button" data-eylem="ara-sil" aria-label="Aramayı temizle">
            <svg class="a-ikon a-ikon-kucuk" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
          </button>
        </label>
        <button class="a-suzgec-tus" type="button" data-eylem="levha-ac" aria-haspopup="dialog">
          <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-sliders-horizontal"/></svg>
          Süzgeç <span class="a-suzgec-rozet" id="a-suzgec-rozet" hidden></span>
        </button>
        <div class="a-cipler" id="a-cipler" role="group" aria-label="Durum süzgeci"></div>
        <div class="a-suzgec-sag">
          <div class="a-seciciler" id="a-seciciler"></div>
          <button class="a-temizle" type="button" data-eylem="temizle" id="a-temizle">
            <svg class="a-ikon a-ikon-kucuk" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-filter-x"/></svg>
            Temizle
          </button>
        </div>
      </div>

      <div class="a-liste-kap" id="a-liste"></div>
      </div>

      <section class="a-plan" id="a-plan" aria-label="Plan" hidden></section>
    </main>
  </div>

<dialog class="a-pencere" id="a-red-pencere" aria-labelledby="a-red-baslik">
  <form method="dialog" id="a-red-form">
    <div class="a-pencere-bas">
      <h2 id="a-red-baslik">Planı reddet</h2>
      <button class="a-ikon-tus" type="button" data-eylem="pencere-kapat" aria-label="Kapat">
        <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
      </button>
    </div>
    <div class="a-pencere-govde">
      <p class="a-pencere-ozet" id="a-red-ozet"></p>
      <label class="a-etiket" for="a-red-gerekce">Gerekçe</label>
      <textarea class="a-alan" id="a-red-gerekce" maxlength="500" placeholder="Planlama ekibi bu gerekçeyi görür."></textarea>
      <p class="a-ipucu" id="a-red-ipucu">Gerekçe yazılmadan plan reddedilemez.</p>
    </div>
    <div class="a-pencere-alt">
      <button class="a-tus a-tus-ikincil" type="button" data-eylem="pencere-kapat">Vazgeç</button>
      <button class="a-tus a-tus-tehlike" type="submit" id="a-red-onay" disabled>Reddet</button>
    </div>
  </form>
</dialog>

<dialog class="a-pencere" id="a-levha" aria-labelledby="a-levha-baslik">
  <div class="a-pencere-bas">
    <h2 id="a-levha-baslik">Süzgeç</h2>

    <button class="a-tus a-tus-ikincil" type="button" data-eylem="temizle">Temizle</button>
    <button class="a-tus a-tus-birincil" type="button" data-eylem="levha-kapat" id="a-levha-uygula">Sonuçları göster</button>
  </div>
