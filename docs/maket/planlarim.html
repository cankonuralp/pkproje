<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planlar · probata maket</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../marka/favicon.svg" type="image/svg+xml">
<!-- tema çizimden ÖNCE (tek kaynak: bütün maketler) -->
<script src="../assets/maket-tema.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/maket.css">
</head>
<body>
<!-- Kabuk (yan menü, üst çubuk, çekmece, süzgeç levhası, bildirim) maket-ortak.js MK.kabuk() ile bu <main>'in etrafına kurulur
     (2026-09-24: bütün maketler aynı üreticiden, MAKET-PLANI §3.2). -->
<main class="a-icerik" id="a-icerik">
  <!-- GÖRÜNÜM 1 · liste (adres #/ ya da boş). GÖRÜNÜM 2 · plan içi (#/plan/<id>), maket.js planCiz() doldurur. -->
  <div id="a-liste-gorunum">
  <div class="a-sayfa-bas">
    <h1 tabindex="-1">Planlar</h1>
    <span class="a-sayac" id="a-sayac" aria-live="polite"></span>
  </div>

  <!-- SÜZGEÇ (kalıp 15): TEK ÜRETİCİ — MK.suzgecHtml("l") doldurur; plan içindeki ekipman ve rapor süzgeçleri de
       aynı üreticiden. Sıra: arama → çipler → ve/veya → seçiciler + Temizle sağda; telefonda seçiciler levhada. -->
  <div id="a-suzgec-kap"></div>

  <div class="a-liste-kap" id="a-liste"></div>
  </div>

  <section class="a-plan" id="a-plan" aria-label="Plan" hidden></section>
</main>

<dialog class="a-pencere" id="a-red-pencere" aria-labelledby="a-red-baslik">
  <form method="dialog" id="a-red-form">
    <div class="a-pencere-bas">
      <h2 id="a-red-baslik">Planı reddet</h2>
      <button class="a-ikon-tus" type="button" data-eylem="pencere-kapat" aria-label="Kapat">
        <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
      </button>
    </div>
    <div class="a-pencere-govde">
      <p class="a-pencere-ozet" id="a-red-ozet"></p>
      <label class="a-etiket" for="a-red-gerekce">Gerekçe</label>
      <textarea class="a-alan" id="a-red-gerekce" maxlength="500" placeholder="Planlama ekibi bu gerekçeyi görür."></textarea>
      <p class="a-ipucu" id="a-red-ipucu">Gerekçe yazılmadan plan reddedilemez.</p>
    </div>
    <div class="a-pencere-alt">
      <button class="a-tus a-tus-ikincil" type="button" data-eylem="pencere-kapat">Vazgeç</button>
      <button class="a-tus a-tus-tehlike" type="submit" id="a-red-onay" disabled>Reddet</button>
    </div>
  </form>
</dialog>

<!-- EKİPMAN EKLE (3. tur): iki yol — yeni ekipman (kod elle, firmada eşsiz) · tesiste kayıtlı ekipmanı plana al.
     Form penceresi iki sütunlu; içindeki her kutu pencereyi doldurur, alanlar veri tipine göre (kalıp 3, 10). -->
<dialog class="a-pencere a-pencere-form" id="a-ekle-pencere" aria-labelledby="a-ekle-baslik">
  <div class="a-pencere-bas">
    <h2 id="a-ekle-baslik">Ekipman ekle</h2>
    <button class="a-ikon-tus" type="button" data-eylem="ekle-kapat" aria-label="Kapat">
      <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
    </button>
  </div>
  <div class="a-pencere-govde">
    <p class="a-pencere-ozet" id="a-ekle-ozet"></p>
    <div class="a-sekmeler" id="a-ekle-sekmeler" role="group" aria-label="Ekleme yolu"></div>
    <div id="a-ekle-govde"></div>
  </div>
  <div class="a-pencere-alt" id="a-ekle-alt"></div>
</dialog>

<script src="../assets/maket-ortak.js"></script>
<script src="../assets/maket-veri.js"></script>
<script src="../assets/maket.js"></script>
</body>
</html>
