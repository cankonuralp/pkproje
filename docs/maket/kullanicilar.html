<!-- 2026-09-25 (reisim, M1 cevapları: "159 birleşsin"): Kullanıcılar ekranı Personel'e katıldı. Eski bağlantılar (toplu bakış,
     yer imleri) karşılığına gider: #/roller → Rol yetkileri · #/k/<kişi> → kişinin kartı · öteki → Personel listesi. -->
<script>
  (function () {
    var h = location.hash, m = /^#\/k\/([a-z0-9]+)$/.exec(h);
    location.replace("personel.html" + (h === "#/roller" ? "#/roller" : m ? "#/p/" + m[1] : "#/"));
  })();
</script>
</head>
<body>
<p><a href="personel.html">Kullanıcılar artık Personel ekranında.</a></p>
</body>
