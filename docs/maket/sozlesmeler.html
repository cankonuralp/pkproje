<!-- MAKET M5 + M13 · Sözleşmeler (modül 12) — 2. tur 2026-09-26, ONAY BEKLİYOR. Reisim: "sözleşmeler ... firma ile fabrika arasındaki
     sözleşme" → bu ekran İŞ SÖZLEŞMELERİ; İSG-KATİP bilgisi (tesis başına denetçi → sözleşme ID, isteğe bağlı onay tarihi ve PDF) sözleşmenin
     içinde. Ayrı "İSG-KATİP kayıtları" sekmesi kalktı. Adres: #/ liste (?kisi=<id> denetçiye göre · ?musteri=<id>) · #/s/<no> sözleşme ·
     #/s/<no>/isg-ekle?tesis=<id>&kisi=<id> · #/s/<no>/isg/<id> ID düzenle · #/sablon sözleşme şablonu · #/yeni (?teklif=<no>) sözleşme hazırla.
     Eski adresler (#/isg…) karşılığına gider. -->
<main class="a-icerik" id="a-icerik">
  <div id="a-liste-gorunum">
    <div class="a-sayfa-bas">
      <h1 tabindex="-1">Sözleşmeler</h1>
      <span class="a-sayac" id="a-sayac" aria-live="polite"></span>
      <a class="a-tus a-tus-ikincil a-bolum-tus" href="#/sablon"><svg class="a-ikon a-ikon-kucuk" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-file-text"/></svg>Sözleşme şablonu</a>
      <button class="a-tus a-tus-birincil" type="button" data-eylem="yeni"><svg class="a-ikon a-ikon-kucuk" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-plus"/></svg>Sözleşme hazırla</button>
    </div>
    <div id="a-uyari"></div>
    <div id="a-suzgec-kap"></div>
    <div class="a-liste-kap" id="a-liste"></div>
  </div>
  <section id="a-nesne" aria-label="İş sözleşmesi" hidden></section>
  <div id="a-form-gorunum" hidden></div>
</main>

<!-- tek pencere: İSG-KATİP ID ekle / düzenle · sözleşme şablonu (içerik maket-issoz.js) -->
<dialog class="a-pencere a-pencere-form" id="a-pencere" aria-labelledby="a-pencere-baslik">
  <div class="a-pencere-bas">
    <h2 id="a-pencere-baslik"></h2>
    <button class="a-ikon-tus" type="button" data-eylem="pencere-kapat" aria-label="Kapat">
      <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
    </button>
  </div>
  <div class="a-pencere-govde" id="a-pencere-govde"></div>
  <div class="a-pencere-alt" id="a-pencere-alt"></div>
</dialog>
<script src="../assets/maket-ortak.js"></script>
<script src="../assets/maket-veri.js"></script>
<script src="../assets/maket-issoz.js"></script>
</body>
