<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Müşteri paneli · probata maket</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../marka/favicon.svg" type="image/svg+xml">
<script src="../assets/maket-tema.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/maket.css">
</head>
<body>
<!-- MAKET M11 · Müşteri Paneli (modül 17) — ONAY BEKLİYOR. Müşterinin kendi girişi; firmanın modül menüsü YOK. Yalnız kendi imzalı raporları.
     Adres: #/ raporlar · #/uygunsuz uygunsuzluklar · #/r/<rapor no> rapor (PDF) · #/excel "Uygunsuzları indir" önizlemesi · ?musteri=<id> (firma ekranından önizleme) -->
<main class="a-icerik" id="a-icerik">
  <div id="a-liste-gorunum">
    <div class="a-sayfa-bas">
      <h1 tabindex="-1">Raporlarınız</h1>
      <span class="a-sayac" id="a-sayac" aria-live="polite"></span>
      <button class="a-tus a-tus-birincil a-bolum-tus" type="button" data-eylem="excel-ac"><svg class="a-ikon a-ikon-kucuk" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-file-check"/></svg>Uygunsuzları indir</button>
    </div>
    <p class="a-bolum-aciklama" id="a-alt"></p>
    <nav class="a-sekmeler a-sekmeler-sayfa" aria-label="Panel görünümleri" id="a-sekmeler"></nav>
    <div id="a-uyari"></div>
    <div id="a-suzgec-kap"></div>
    <div class="a-liste-kap" id="a-liste"></div>
    <div id="a-sayfa"></div>
  </div>
  <section id="a-nesne" aria-label="Rapor" hidden></section>
</main>

<!-- "Uygunsuzları indir" Excel önizlemesi (içerik maket-musteri.js) -->
<dialog class="a-pencere a-pencere-form" id="a-pencere" aria-labelledby="a-pencere-baslik">
  <div class="a-pencere-bas">
    <h2 id="a-pencere-baslik"></h2>
    <button class="a-ikon-tus" type="button" data-eylem="pencere-kapat" aria-label="Kapat">
      <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
    </button>
  </div>
  <div class="a-pencere-govde" id="a-pencere-govde"></div>
  <div class="a-pencere-alt" id="a-pencere-alt"></div>
</dialog>
<script src="../assets/maket-ortak.js"></script>
<script src="../assets/maket-veri.js"></script>
<script src="../assets/maket-belge.js"></script>
<script src="../assets/maket-musteri.js"></script>
</body>
</html>
