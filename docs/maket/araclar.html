<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Araçlar · probata maket</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../marka/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/maket.css">

<body>
<!-- MAKET Araçlar (modül 23) — AA4, 2026-10-02, ONAY BEKLİYOR. Araç kimde, kilometre, belge bitişleri; fotoğraflı teslim tutanağı → zimmet.
     Adres: #/ araçlar (yönetici) · #/tutanaklar · #/sablon · #/a/<id> araç · #/tutanak[/<id>] tutanak penceresi ·
     #/benim… sürücü görünümü (yalnız kendi aracı) -->
<main class="a-icerik" id="a-icerik">
  <div id="a-liste-gorunum">
    <div class="a-sayfa-bas">
      <h1 tabindex="-1" id="a-baslik">Araçlar</h1>
      <span class="a-sayac" id="a-sayac" aria-live="polite"></span>
      <div class="a-eylem-cubugu a-bolum-tus"><span id="a-gorunum-tus"></span>
        <button class="a-tus a-tus-birincil" type="button" data-eylem="tutanak-ac"><svg class="a-ikon a-ikon-kucuk" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-clipboard-check"/></svg><span id="a-tutanak-ad">Teslim tutanağı</span></button></div>
    </div>
    <nav class="a-sekmeler a-sekmeler-sayfa" aria-label="Araç görünümleri" id="a-sekmeler"></nav>
    <div class="a-liste-kap" id="a-liste"></div>
  </div>
  <section id="a-nesne" aria-label="Araç" hidden></section>
</main>

<dialog class="a-pencere a-pencere-form" id="a-pencere" aria-labelledby="a-pencere-baslik">
  <div class="a-pencere-bas">
    <h2 id="a-pencere-baslik"></h2>
    <button class="a-ikon-tus" type="button" data-eylem="pencere-kapat" aria-label="Kapat">
      <svg class="a-ikon" aria-hidden="true"><use href="../vendor/lucide-1.47.0/ikonlar.svg#i-x"/></svg>
    </button>
  </div>
  <div class="a-pencere-govde" id="a-pencere-govde"></div>
  <div class="a-pencere-alt" id="a-pencere-alt"></div>
</dialog>
<script src="../assets/maket-ortak.js"></script>
<script src="../assets/maket-veri.js"></script>
<script src="../assets/maket-belge.js"></script>
<script src="../assets/maket-araclar.js"></script>
</body>
</html>
