<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Format kurucu · serbest düzen · probata maket</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../marka/favicon.svg" type="image/svg+xml">
<script src="../assets/maket-tema.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<!-- MAKET · FORMAT KURUCU SERBEST DÜZEN (2026-10-24; reisim: "hangi firmanın hangi PDF formunu yüklersem yükleyeyim şablon o forma dönüşsün ve format
     kurucuda İSTEDİĞİM GİBİ düzenleyebileyim"). Tek başına sayfa: maket kabuğu kullanılmaz, renkler tokens.css'ten. Kâğıt her bölümü satır / sütun /
     hücre birleştirmesi elde olan bir tablo olarak çizer; bölümler yan yana ya da alt alta; yazı tipi, boy, renk, kenar, hizalama hücre başına.
     Saha ekranı ve belge aynı tanımdan çizilir. Tanım yalnız bu tarayıcıda saklanır (Baştan başla siler). Form ve bütün değerler UYDURMADIR.
     Telefon düzeni ayrı: 768 px altı (maket çubuğundaki "Telefon" aynı sayfayı 375 px çerçevede açar). -->
<style>
@font-face { font-family: "Carlito"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../vendor/carlito-5.3.0/carlito-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+2000-206F; }
@font-face { font-family: "Carlito"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("../vendor/carlito-5.3.0/carlito-latin-ext-400-normal.woff2") format("woff2"); unicode-range: U+0100-024F,U+1E00-1EFF; }
@font-face { font-family: "Carlito"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../vendor/carlito-5.3.0/carlito-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+2000-206F; }
@font-face { font-family: "Carlito"; font-weight: 700; font-style: normal; font-display: swap;
  src: url("../vendor/carlito-5.3.0/carlito-latin-ext-700-normal.woff2") format("woff2"); unicode-range: U+0100-024F,U+1E00-1EFF; }

/* Kâğıt = basılacak belge: iki temada da beyaz zemin, siyah yazı (src/belge/belge.css ile aynı ilke). Değerler bilerek temadan bağımsız. */
:root {
  --kg-zemin: #FFFFFF; --kg-yazi: #111111; --kg-cizgi: #2A2A2A; --kg-golge: 0 2px 10px rgba(15, 42, 61, .14);
  --kg-isaret: #1B4461; --kg-isaret-zemin: #E6EEF4; --kg-alan-zemin: #F1EFE8; --kg-alan-yazi: #4E5F6C;
  --kg-secim: rgba(31, 163, 122, .16); --kg-secim-kenar: #1FA37A; --kg-sayfa-sonu: #C2BEB2;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--zemin); color: var(--yazi); font-family: var(--yazi-tipi); font-size: var(--boy-govde); line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.fs-ikon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fs-ikon-k { width: 15px; height: 15px; }
:focus-visible { outline: 2px solid var(--odak); outline-offset: 2px; }

/* ── maket çubuğu (uygulamanın parçası değil) ─────────────────────────────────────────── */
.fs-maket { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 16px; background: var(--cubuk-zemin); color: var(--cubuk-yazi); font-size: var(--boy-kucuk); }
.fs-maket b { font-weight: 600; }
.fs-maket .fs-ara { flex: 1; }
.fs-maket button { height: 28px; padding: 0 10px; border-radius: var(--r-kucuk); border: 1px solid var(--cubuk-yazi2); background: transparent; color: var(--cubuk-yazi); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.fs-maket button[aria-pressed="true"] { background: var(--cubuk-secili); border-color: var(--cubuk-onay); }
html.fs-cerceve .fs-maket { display: none; }

/* ── tuşlar ─────────────────────────────────────────────────────────────────────────── */
.fs-tus { height: var(--tus-y); padding: 0 12px; border-radius: var(--r-kucuk); border: 1px solid var(--kenar-alan); background: var(--kart); color: var(--yazi);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.fs-tus:hover:not(:disabled) { background: var(--zemin2); }
.fs-tus:disabled { opacity: .45; cursor: not-allowed; }
.fs-tus-birincil { background: var(--birincil); color: var(--birincil-uzeri); border-color: transparent; font-weight: 600; }
.fs-tus-birincil:hover:not(:disabled) { background: var(--birincil-2); }
.fs-tus-ikon { width: var(--tus-y); padding: 0; justify-content: center; }
.fs-tus-kucuk { height: 28px; padding: 0 9px; font-size: var(--boy-kucuk); }
.fs-tus-kucuk.fs-tus-ikon { width: 28px; padding: 0; }
.fs-tus[aria-pressed="true"] { background: var(--bilgi-zemin); border-color: var(--vurgu-2); color: var(--bilgi-yazi); }
.fs-tus-sil { color: var(--hata-yazi); }
.fs-segment { display: inline-flex; border: 1px solid var(--kenar-alan); border-radius: var(--r-kucuk); overflow: hidden; background: var(--kart); }
.fs-segment button { height: calc(var(--tus-y) - 2px); padding: 0 12px; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fs-segment button + button { border-left: 1px solid var(--kenar); }
.fs-segment button[aria-pressed="true"] { background: var(--vurgu); color: var(--vurgu-uzeri); font-weight: 600; }
.fs-segment-k button { height: 26px; padding: 0 8px; font-size: var(--boy-kucuk); }

/* ── sayfa başı + araç çubuğu ───────────────────────────────────────────────────────── */
.fs-uyg { display: flex; flex-direction: column; min-height: calc(100vh - 40px); }
html.fs-cerceve .fs-uyg { min-height: 100vh; }
.fs-bas { padding: 12px var(--bosluk-sayfa) 0; }
.fs-kirinti { font-size: var(--boy-kucuk); color: var(--yazi2); display: flex; gap: 6px; flex-wrap: wrap; }
.fs-kirinti a { color: inherit; }
.fs-bas-satir { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.fs-bas h1 { margin: 0; font-size: var(--boy-baslik); font-weight: var(--kal-baslik); }
.fs-durum { font-size: var(--boy-kucuk); padding: 2px 8px; border-radius: var(--r-tam); background: var(--uyari-zemin); color: var(--uyari-yazi); font-weight: 600; }
.fs-kaynak { font-size: var(--boy-kucuk); color: var(--yazi2); display: inline-flex; align-items: center; gap: 4px; }
.fs-arac { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px var(--bosluk-sayfa); border-bottom: 1px solid var(--kenar); }
.fs-arac .fs-ara { flex: 1; }
.fs-arac-grup { display: inline-flex; gap: 4px; align-items: center; }
.fs-ekle-tus-tablet { display: none; }
.fs-yakin { display: inline-flex; align-items: center; gap: 4px; font-size: var(--boy-kucuk); color: var(--yazi2); }

/* ── üç sütun ───────────────────────────────────────────────────────────────────────── */
.fs-govde { flex: 1; display: grid; grid-template-columns: 236px minmax(0, 1fr) 312px; min-height: 0; }
.fs-govde[data-form="acik"] { grid-template-columns: 236px minmax(0, .8fr) minmax(0, 1fr) 312px; }
.fs-panel { background: var(--kart); border-right: 1px solid var(--kenar); overflow: auto; max-height: calc(100vh - 40px); position: sticky; top: 0; }
.fs-ayar { border-right: 0; border-left: 1px solid var(--kenar); }
.fs-panel-bas { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--kenar); position: sticky; top: 0; background: var(--kart); z-index: 2; }
.fs-panel-bas h2 { margin: 0; font-size: var(--boy-bolum); font-weight: var(--kal-bolum); flex: 1; }
.fs-panel-kapat { display: none; }
.fs-panel-ic { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.fs-etiket { font-size: var(--boy-etiket); font-weight: var(--kal-etiket); color: var(--yazi2); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
.fs-grup { display: flex; flex-direction: column; gap: 6px; }
.fs-satirlar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fs-parca { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 6px 8px; border: 1px solid var(--kenar); border-radius: var(--r-kucuk); background: var(--kart); cursor: pointer; text-align: left; }
.fs-parca:hover { background: var(--zemin2); }
.fs-parca small { display: block; color: var(--yazi3); font-size: var(--boy-etiket); }

/* tablo seçici (satır × sütun) */
.fs-izgara-sec { display: grid; grid-template-columns: repeat(8, 22px); gap: 3px; }
.fs-izgara-sec button { width: 22px; height: 22px; border: 1px solid var(--kenar-alan); border-radius: 3px; background: var(--kart); padding: 0; cursor: pointer; }
.fs-izgara-sec button.fs-isik { background: var(--onay-zemin); border-color: var(--onay); }
.fs-izgara-not { font-size: var(--boy-kucuk); color: var(--yazi2); min-height: 18px; }

/* ── orta: kâğıt ────────────────────────────────────────────────────────────────────── */
.fs-orta { min-width: 0; overflow: auto; background: var(--zemin2); padding: 20px; position: relative; }
.fs-yakinlik { position: sticky; left: 0; top: 0; z-index: 5; display: flex; justify-content: flex-end; margin-bottom: 8px; pointer-events: none; }
.fs-yakinlik > * { pointer-events: auto; }
.fs-kagit-kap { width: max-content; margin: 0 auto; }
.fs-kagit { width: 794px; min-height: 1123px; background: var(--kg-zemin); color: var(--kg-yazi); box-shadow: var(--kg-golge); padding: 45px; position: relative; }
.fs-dsatir { display: flex; align-items: flex-start; position: relative; }
.fs-bolum { position: relative; min-width: 0; }
.fs-bolum-et { position: absolute; left: -1px; top: -21px; height: 20px; display: none; align-items: center; gap: 2px; padding: 0 6px 0 2px; border-radius: 4px 4px 0 0;
  background: var(--vurgu-2); color: var(--vurgu-uzeri); font: 600 11px/1 var(--yazi-tipi); white-space: nowrap; z-index: 4; }
:root[data-tema="koyu"] .fs-bolum-et { background: #1B4461; color: #FFFFFF; }
.fs-tutamak { cursor: grab; display: inline-flex; align-items: center; padding: 0 2px; touch-action: none; border: 0; background: transparent; color: inherit; height: 20px; }
.fs-tutamak:active { cursor: grabbing; }
.fs-kip-kagit .fs-bolum:hover > .fs-bolum-et, .fs-kip-kagit .fs-bolum.fs-secili > .fs-bolum-et { display: inline-flex; }
.fs-kip-kagit .fs-bolum:hover { outline: 1px dashed var(--kg-isaret); outline-offset: 1px; }
.fs-kip-kagit .fs-bolum.fs-secili { outline: 2px solid var(--kg-secim-kenar); outline-offset: 1px; }
.fs-arali { flex: none; position: relative; align-self: stretch; }
.fs-kip-kagit .fs-arali { cursor: col-resize; touch-action: none; }
.fs-kip-kagit .fs-arali:hover::after, .fs-arali.fs-surukle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--kg-secim-kenar); }

table.fs-tablo { width: 100%; border-collapse: collapse; table-layout: fixed; }
.fs-tablo td { padding: 2px 4px; vertical-align: middle; overflow-wrap: anywhere; position: relative; }
.fs-kip-kagit .fs-tablo td { cursor: cell; }
.fs-tablo td.fs-hsec { background-image: linear-gradient(var(--kg-secim), var(--kg-secim)); box-shadow: inset 0 0 0 1px var(--kg-secim-kenar); }
.fs-tablo td.fs-hedit { box-shadow: inset 0 0 0 2px var(--kg-secim-kenar); cursor: text; }
.fs-tablo td [contenteditable] { outline: 0; min-height: 1em; }
.fs-tablo tr.fs-tekrar > td:first-child::before { content: "↻"; position: absolute; left: -16px; top: 50%; transform: translateY(-50%); font: 700 12px/1 var(--yazi-tipi); color: var(--kg-secim-kenar); }
.fs-kip-belge .fs-tablo tr.fs-tekrar > td:first-child::before { content: none; }
.fs-isaret { display: inline-flex; align-items: center; gap: 3px; max-width: 100%; padding: 0 4px; border-radius: 3px; font: 500 10px/1.5 var(--yazi-tipi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
.fs-is-kayit { background: var(--kg-isaret-zemin); color: var(--kg-isaret); }
.fs-is-alan { background: var(--kg-alan-zemin); color: var(--kg-alan-yazi); border: 1px dashed var(--kg-alan-yazi); }
.fs-is-cevap, .fs-is-formul, .fs-is-imza, .fs-is-foto { background: var(--kg-alan-zemin); color: var(--kg-alan-yazi); }
.fs-is-imza { border: 1px dashed var(--kg-isaret); }
.fs-isaret .fs-ikon { width: 11px; height: 11px; }
.fs-gorsel { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 48px; border: 1px solid var(--kg-cizgi); font: 700 13px/1.1 var(--yazi-tipi); letter-spacing: .08em; color: var(--kg-isaret); text-align: center; }
.fs-imza-bos { display: block; min-height: 40px; }
.fs-imza-eimza { display: block; min-height: 40px; border: 1px dashed var(--kg-sayfa-sonu); }
.fs-foto-kutu { display: flex; align-items: center; justify-content: center; min-height: 70px; border: 1px dashed var(--kg-cizgi); font-size: 10px; color: var(--kg-alan-yazi); }
.fs-sutun-tut { position: absolute; top: -9px; width: 12px; height: 9px; margin-left: -6px; cursor: col-resize; touch-action: none; z-index: 3; }
.fs-sutun-tut::after { content: ""; position: absolute; left: 5px; top: 0; width: 2px; height: 9px; background: var(--kg-secim-kenar); }
.fs-sayfa-sonu { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--kg-sayfa-sonu); pointer-events: none; }
.fs-sayfa-sonu span { position: absolute; right: 6px; top: -16px; font: 500 10px/1 var(--yazi-tipi); color: var(--kg-alan-yazi); background: var(--kg-zemin); padding: 2px 4px; }
.fs-birak { position: absolute; background: var(--kg-secim-kenar); z-index: 6; pointer-events: none; border-radius: 2px; }
.fs-hayalet { position: fixed; z-index: 9999; pointer-events: none; padding: 4px 8px; border-radius: 4px; background: var(--vurgu-2); color: var(--vurgu-uzeri); font-size: 12px; font-weight: 600; box-shadow: var(--golge-2); }
.fs-kagit-sablon { filter: grayscale(1); }

/* basılı form paneli */
.fs-form { display: none; min-width: 0; overflow: auto; background: var(--zemin2); border-right: 1px solid var(--kenar); padding: 12px; max-height: calc(100vh - 40px); position: sticky; top: 0; }
.fs-govde[data-form="acik"] .fs-form { display: block; }
.fs-form-bas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.fs-form-bas b { flex: 1; min-width: 0; font-size: var(--boy-kucuk); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fs-form-kagit { transform-origin: 0 0; }

/* ── sağ panel: ayarlar ─────────────────────────────────────────────────────────────── */
.fs-sekmeler { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--kenar); position: sticky; top: 49px; background: var(--kart); z-index: 2; }
.fs-sekmeler button { height: 36px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; color: var(--yazi2); font-weight: 500; }
.fs-sekmeler button[aria-selected="true"] { color: var(--yazi); border-bottom-color: var(--onay); font-weight: 600; }
.fs-secim-ozet { font-size: var(--boy-kucuk); color: var(--yazi2); }
.fs-secim-ozet b { color: var(--yazi); }
.fs-alan { display: flex; flex-direction: column; gap: 4px; }
.fs-alan label, .fs-alan .fs-al-ad { font-size: var(--boy-kucuk); color: var(--yazi2); font-weight: 500; }
.fs-girdi { height: var(--tus-y); padding: 0 8px; border: 1px solid var(--kenar-alan); border-radius: var(--r-kucuk); background: var(--kart); width: 100%; min-width: 0; }
textarea.fs-girdi { height: auto; min-height: 56px; padding: 6px 8px; resize: vertical; }
.fs-iki { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fs-tur-liste { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fs-tur-liste button { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 8px; border: 1px solid var(--kenar); border-radius: var(--r-kucuk); background: var(--kart); cursor: pointer; text-align: left; font-size: var(--boy-kucuk); }
.fs-tur-liste button[aria-pressed="true"] { border-color: var(--onay); background: var(--onay-zemin); color: var(--onay-yazi); font-weight: 600; }
.fs-renkler { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fs-renk { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--kenar-alan); cursor: pointer; padding: 0; position: relative; }
.fs-renk[aria-pressed="true"] { outline: 2px solid var(--odak); outline-offset: 1px; }
.fs-renk-yok { background: linear-gradient(135deg, transparent 45%, var(--hata-yazi) 45%, var(--hata-yazi) 55%, transparent 55%), var(--kart); }
.fs-renk-ozel { width: 30px; height: 26px; padding: 0 2px; border: 1px solid var(--kenar-alan); border-radius: 4px; background: var(--kart); cursor: pointer; }
.fs-kenar-tuslar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.fs-kenar-tuslar button { height: 32px; border: 1px solid var(--kenar-alan); border-radius: var(--r-kucuk); background: var(--kart); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.fs-kenar-tuslar svg { width: 18px; height: 18px; }
.fs-onay-kutu { display: flex; align-items: center; gap: 8px; font-size: var(--boy-kucuk); cursor: pointer; }
.fs-onay-kutu input { width: 16px; height: 16px; accent-color: var(--onay); }
.fs-ayrac { height: 1px; background: var(--kenar); margin: 2px 0; }
.fs-sayi { display: inline-flex; align-items: center; border: 1px solid var(--kenar-alan); border-radius: var(--r-kucuk); overflow: hidden; height: var(--tus-y); background: var(--kart); }
.fs-sayi button { width: 28px; height: 100%; border: 0; background: transparent; cursor: pointer; }
.fs-sayi input { width: 44px; height: 100%; border: 0; text-align: center; background: transparent; }
.fs-bos { color: var(--yazi2); font-size: var(--boy-kucuk); }

/* ── saha ekranı ────────────────────────────────────────────────────────────────────── */
.fs-saha { display: none; padding: 16px var(--bosluk-sayfa) 24px; flex-direction: column; gap: 12px; }
.fs-kip-saha .fs-saha { display: flex; }
.fs-kip-saha .fs-govde { display: none; }
.fs-saha-satir { display: grid; gap: 12px; align-items: start; }
.fs-skart { background: var(--kart); border: 1px solid var(--kenar); border-radius: var(--r-orta); overflow: hidden; min-width: 0; }
.fs-skart > h3 { margin: 0; padding: 9px 12px; font-size: var(--boy-bolum); font-weight: var(--kal-bolum); border-bottom: 1px solid var(--kenar); background: var(--zemin2); }
.fs-skart-ic { padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px; }
.fs-skart-ic.fs-tek { grid-template-columns: 1fr; gap: 0; }
.fs-salan { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fs-salan.fs-genis { grid-column: 1 / -1; }
.fs-salan .fs-segment { flex-wrap: wrap; width: max-content; max-width: 100%; }
.fs-salan > span, .fs-salan > label > span { font-size: var(--boy-kucuk); color: var(--yazi2); font-weight: 500; }
.fs-birimli { display: flex; align-items: center; gap: 6px; }
.fs-birimli .fs-girdi { flex: 1; }
.fs-birimli small { color: var(--yazi2); }
.fs-madde { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--kenar); }
.fs-madde:last-child { border-bottom: 0; }
.fs-madde-no { width: 24px; flex: none; color: var(--yazi2); font-variant-numeric: tabular-nums; }
.fs-madde-ad { flex: 1; min-width: 0; }
.fs-kunye { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; padding: 10px 12px; }
.fs-kunye div { min-width: 0; }
.fs-kunye span { display: block; font-size: var(--boy-etiket); color: var(--yazi2); }
.fs-kunye b { font-weight: 500; overflow-wrap: anywhere; }
.fs-stablo-kap { overflow-x: auto; }
.fs-stablo { width: 100%; border-collapse: collapse; min-width: 420px; }
.fs-stablo th { text-align: left; font-size: var(--boy-kucuk); color: var(--yazi2); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--kenar); }
.fs-stablo td { padding: 4px 6px; border-bottom: 1px solid var(--kenar); }
.fs-stablo-alt { padding: 8px 0 2px; }
.fs-hesap { display: inline-flex; align-items: center; gap: 4px; color: var(--yazi2); }

/* ── telefon alt çubuğu ve levhalar ─────────────────────────────────────────────────── */
.fs-alt { display: none; }
.fs-perde { display: none; position: fixed; inset: 0; background: var(--perde); z-index: 40; }
.fs-perde[data-acik] { display: block; }

      case "telefon": var f = $("#fs-telefon-cerceve"); f.src = location.pathname + "?telefon=1&tema=" + document.documentElement.getAttribute("data-tema"); $("#fs-telefon").setAttribute("data-acik", ""); return;
      case "telefon-kapat": $("#fs-telefon").removeAttribute("data-acik"); $("#fs-telefon-cerceve").src = "about:blank"; return;
      case "tema": var yeni = document.documentElement.getAttribute("data-tema") === "koyu" ? "acik" : "koyu"; document.documentElement.setAttribute("data-tema", yeni); try { localStorage.setItem("probata-tema", yeni); } catch (er) {} return;
      case "sifirla": D = baslangic(); GECMIS = []; ILERI = []; sakla(); S.bolum = null; S.sec = null; S.duzenle = null; ciz_(); bildir("Maket baştan başladı"); return;
    }
  });
  function parcaEkle(liste) {
    degistir(function () {
      var B = seciliB(), hedef = B ? B.id : null;
      liste.forEach(function (b, i) {
        if (i === 0) { if (hedef) bolumYerlestir(b, hedef, "alt"); else { b.oran = 100; D.satirlar.push({ bolumler: [b] }); } }
        else bolumYerlestir(b, liste[i - 1].id, "sag");
      });
      if (liste.length > 1) { var y = bolumBul(liste[0].id); D.satirlar[y.s].bolumler.forEach(function (x) { x.oran = 100 / D.satirlar[y.s].bolumler.length; }); }
      S.bolum = liste[0].id; S.sec = { r1: 0, c1: 0, r2: 0, c2: 0 };
    });
    panelKapat();
    var e = document.querySelector('[data-bolum="' + liste[0].id + '"]'); if (e) e.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function dogrula() { if (S.bolum && !bolumBul(S.bolum)) { S.bolum = null; S.sec = null; } var B = seciliB(); if (B && S.sec && (S.sec.r2 >= B.satir.length || S.sec.c2 >= B.sutun.length)) S.sec = { r1: 0, c1: 0, r2: 0, c2: 0 }; }

  /* ── olaylar: girdi (panel yeniden çizilmeden; odak kaçmaz) ─────────────────────────── */
  var girdiAdim = null;
  document.addEventListener("focusin", function (e) { if (e.target.dataset && e.target.dataset.girdi) girdiAdim = null; });
  function girdiYaz(fn, panelDe) { if (!girdiAdim) { adim(); girdiAdim = 1; } fn(); sakla(); kagitCiz(); if (panelDe) ayarCiz(); }
  document.addEventListener("input", function (e) {
    var g = e.target.dataset && e.target.dataset.girdi; if (!g) return;
    var v = e.target.type === "checkbox" ? e.target.checked : e.target.value, B = seciliB(), a = B && S.sec ? genislet(B, S.sec) : null;
    switch (g) {
      case "m": girdiYaz(function () { seciliHucreler(function (h) { if (h.t === "yazi") h.m = v; }); }); break;
      case "ad": case "b": case "f": girdiYaz(function () { seciliHucreler(function (h) { h[g] = v; }); }); break;
      case "sec": girdiYaz(function () { seciliHucreler(function (h) { h.sec = v.split("\n").map(function (x) { return x.trim(); }).filter(Boolean); if (h.t === "cevap") h.o = h.sec[0] || ""; }); }); break;
      case "k": girdiYaz(function () { seciliHucreler(function (h) { h.k = v; }); }); break;
      case "zorunlu": case "eimza": girdiYaz(function () { seciliHucreler(function (h) { h[g] = v; }); }); break;

      case "satir-y": if (a) girdiYaz(function () { B.satir[a.r1].y = +v || 0; }); break;
      case "tekrar": if (a) girdiYaz(function () { var st = B.satir[a.r1]; st.tekrar = v; if (v && !st.ornek) st.ornek = [[], []]; }); break;
      case "bolum-ad": girdiYaz(function () { B.ad = v; }); break;
      case "oran": if (+v >= 10 && +v <= 90) girdiYaz(function () { oranYaz(B, +v); }); break;
      case "bolunmesin": girdiYaz(function () { B.bolunmesin = v; }); break;

      case "b-boy": if (+v >= 6) girdiYaz(function () { D.belge.boy = +v; }); break;
      case "b-kenar": if (+v >= 5) girdiYaz(function () { D.belge.kenar = +v; }); break;
      case "b-ara": if (v !== "") girdiYaz(function () { D.belge.ara = +v; }); break;
      case "b-ic": if (v !== "") girdiYaz(function () { D.belge.ic = +v; }); break;
      case "b-alt": girdiYaz(function () { D.belge.alt = v; }); break;

  });
  document.addEventListener("change", function (e) { var g = e.target.dataset && e.target.dataset.girdi; if (g === "yazi-tipi" || g === "a-tur" || g === "tekrar" || g === "k") ayarCiz(); });
  function sutunGenislik(B, c, yuzde) {
    var komsu = c < B.sutun.length - 1 ? c + 1 : c - 1, toplam = B.sutun[c] + B.sutun[komsu];
    yuzde = Math.max(3, Math.min(toplam - 3, yuzde));
    B.sutun[komsu] = toplam - yuzde; B.sutun[c] = yuzde;
  }
  function oranYaz(B, yuzde) {
    var y = bolumBul(B.id), satir = D.satirlar[y.s], kalan = 100 - yuzde, digerToplam = 0;
    satir.bolumler.forEach(function (x) { if (x !== B) digerToplam += x.oran; });
    satir.bolumler.forEach(function (x) { if (x !== B) x.oran = x.oran / digerToplam * kalan; });
    B.oran = yuzde;
  }

  /* ── olaylar: kâğıtta seçim, yerinde yazı, sürükleme ─────────────────────────────────── */
  var surSec = null;
  function hucreKonum(td) { return { b: td.closest("[data-bolum]").dataset.bolum, r: +td.dataset.r, c: +td.dataset.c }; }
  document.addEventListener("pointerdown", function (e) {
    if (S.kip !== "kagit") return;
    var tut = e.target.closest("[data-tutamak]"); if (tut) { bolumSurukle(e, tut.dataset.tutamak); return; }
    var st = e.target.closest("[data-sutun-tut]"); if (st) { sutunSurukle(e, +st.dataset.sutunTut); return; }
    var ar = e.target.closest("[data-arali]"); if (ar) { araliSurukle(e, ar); return; }
    var td = e.target.closest("#fs-kagit td"); if (!td) return;
    if (e.target.closest("#fs-yerinde")) return;
    var k = hucreKonum(td);
    if (S.duzenle) yerindeBitir();
    if ((e.shiftKey || S.genislet) && S.bolum === k.b && S.sec) { S.sec.r2 = k.r; S.sec.c2 = k.c; S.genislet = false; }
    else { S.bolum = k.b; S.sec = { r1: k.r, c1: k.c, r2: k.r, c2: k.c }; }
    if (e.pointerType === "mouse") { surSec = k; e.preventDefault(); }
    kagitCiz(); ayarCiz();
  });
  document.addEventListener("pointermove", function (e) {
    if (!surSec) return;
    var el = document.elementFromPoint(e.clientX, e.clientY), td = el && el.closest("#fs-kagit td"); if (!td) return;
    var k = hucreKonum(td); if (k.b !== surSec.b) return;
    if (S.sec.r2 !== k.r || S.sec.c2 !== k.c) { S.sec.r2 = k.r; S.sec.c2 = k.c; kagitCiz(); }
  });
  document.addEventListener("pointerup", function () { if (surSec) { surSec = null; ayarCiz(); } });
  document.addEventListener("dblclick", function (e) {
    if (S.kip !== "kagit") return;
    var td = e.target.closest("#fs-kagit td"); if (!td) return;
    var k = hucreKonum(td), B = bolumBul(k.b).b, h = B.h[k.r + "," + k.c];
    if (h.t !== "yazi") { S.sekme = "hucre"; ayarCiz(); return; }
    S.bolum = k.b; S.sec = { r1: k.r, c1: k.c, r2: k.r, c2: k.c }; S.duzenle = { b: k.b, k: k.r + "," + k.c };
    kagitCiz(); var yer = $("#fs-yerinde"); if (yer) yer.focus();
  });
  function yerindeBitir(iptal) {
    var yer = $("#fs-yerinde"), d = S.duzenle; S.duzenle = null;
    if (!yer || !d || iptal) { kagitCiz(); return; }
    var metin = yer.innerText.replace(/\n$/, ""), B = bolumBul(d.b).b, h = B.h[d.k];

  }
  document.addEventListener("focusout", function (e) { if (e.target.id === "fs-yerinde") setTimeout(function () { if (S.duzenle && document.activeElement !== $("#fs-yerinde")) yerindeBitir(); }, 0); });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "fs-yerinde") {
      if (e.key === "Escape") { e.preventDefault(); yerindeBitir(true); }
      else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); yerindeBitir(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {

      if (e.key.toLowerCase() === "y") { e.preventDefault(); $('[data-eylem="ileri"]').click(); return; }
    }
    if (e.key === "Escape") { panelKapat(); $("#fs-telefon").removeAttribute("data-acik"); }
    if (S.kip !== "kagit" || /INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)) return;
    var B = seciliB(); if (!B || !S.sec) return;
    var ok = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (ok) {
      e.preventDefault();
      var r = Math.max(0, Math.min(B.satir.length - 1, (e.shiftKey ? S.sec.r2 : S.sec.r1) + ok[0])), c = Math.max(0, Math.min(B.sutun.length - 1, (e.shiftKey ? S.sec.c2 : S.sec.c1) + ok[1]));
      if (e.shiftKey) { S.sec.r2 = r; S.sec.c2 = c; } else S.sec = { r1: r, c1: c, r2: r, c2: c };
      kagitCiz(); ayarCiz(); return;
    }
    if (e.key === "Enter" || e.key === "F2") { var h = B.h[genislet(B, S.sec).r1 + "," + genislet(B, S.sec).c1]; if (h.t === "yazi") { e.preventDefault(); var a = genislet(B, S.sec); S.duzenle = { b: B.id, k: a.r1 + "," + a.c1 }; kagitCiz(); var yer = $("#fs-yerinde"); if (yer) yer.focus(); } return; }
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); degistir(function () { seciliHucreler(function (h) { if (h.t === "yazi") h.m = ""; }); }); }
  });

  /* sütun genişliği tutamağı */
  function sutunSurukle(e, c) {
    var B = seciliB(), bol = document.querySelector('[data-bolum="' + B.id + '"]'), w = bol.getBoundingClientRect().width, x0 = e.clientX, a0 = B.sutun[c], b0 = B.sutun[c + 1], basladi = false;
    e.preventDefault(); e.target.setPointerCapture(e.pointerId);
    function hareket(ev) {
      if (!basladi) { adim(); basladi = true; }
      var d = (ev.clientX - x0) / w * 100, yeniA = Math.max(3, Math.min(a0 + b0 - 3, a0 + d));
      B.sutun[c] = Math.round(yeniA * 10) / 10; B.sutun[c + 1] = Math.round((a0 + b0 - yeniA) * 10) / 10; kagitCiz();
    }
    function bitti() { document.removeEventListener("pointermove", hareket); document.removeEventListener("pointerup", bitti); if (basladi) { sakla(); ayarCiz(); } }
    document.addEventListener("pointermove", hareket); document.addEventListener("pointerup", bitti);
  }
  /* yan yana iki bölümün arasındaki tutamak: genişlik paylaşımı */
  function araliSurukle(e, el) {
    var p = el.dataset.arali.split(":"), satir = D.satirlar[+p[0]], j = +p[1], A = satir.bolumler[j - 1], Bb = satir.bolumler[j];
    var w = el.parentNode.getBoundingClientRect().width, x0 = e.clientX, a0 = A.oran, b0 = Bb.oran, basladi = false;
    e.preventDefault(); el.classList.add("fs-surukle");
    function hareket(ev) {
      if (!basladi) { adim(); basladi = true; }
      var d = (ev.clientX - x0) / w * 100, yeniA = Math.max(10, Math.min(a0 + b0 - 10, a0 + d));
      A.oran = Math.round(yeniA * 10) / 10; Bb.oran = Math.round((a0 + b0 - yeniA) * 10) / 10;
      var ea = document.querySelector('[data-bolum="' + A.id + '"]'), eb = document.querySelector('[data-bolum="' + Bb.id + '"]');
      ea.style.flex = A.oran + " 1 0"; eb.style.flex = Bb.oran + " 1 0";
    }
    function bitti() { document.removeEventListener("pointermove", hareket); document.removeEventListener("pointerup", bitti); el.classList.remove("fs-surukle"); if (basladi) { sakla(); kagitCiz(); ayarCiz(); } }
    document.addEventListener("pointermove", hareket); document.addEventListener("pointerup", bitti);
  }
  /* bölümü tut-sürükle: hedefin soluna / sağına (yan yana) ya da üstüne / altına (ayrı satır) */
  function bolumSurukle(e, id) {
    e.preventDefault();
    var hay = null, cizgi = null, hedef = null, B = bolumBul(id).b;
    function temizle() { if (hay) hay.remove(); if (cizgi) cizgi.remove(); }
    function hareket(ev) {
      if (!hay) { hay = document.createElement("div"); hay.className = "fs-hayalet"; hay.textContent = B.ad; document.body.appendChild(hay); }
      hay.style.left = (ev.clientX + 12) + "px"; hay.style.top = (ev.clientY + 12) + "px";
      hedef = null;
      var kagit = $("#fs-kagit"), kr = kagit.getBoundingClientRect(), z = S.olcek || 1;
      document.querySelectorAll("#fs-kagit [data-bolum]").forEach(function (el) {
        if (el.dataset.bolum === id) return;
        var r = el.getBoundingClientRect();
        if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top - 6 && ev.clientY <= r.bottom + 6) {
          var x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
          hedef = { id: el.dataset.bolum, yer: x < 0.22 ? "sol" : x > 0.78 ? "sag" : y < 0.5 ? "ust" : "alt", r: r };
        }
      });
      if (!cizgi) { cizgi = document.createElement("div"); cizgi.className = "fs-birak"; document.body.appendChild(cizgi); cizgi.style.position = "fixed"; }
      if (!hedef) { cizgi.style.display = "none"; return; }
      var r = hedef.r; cizgi.style.display = "block";
      if (hedef.yer === "sol" || hedef.yer === "sag") { cizgi.style.left = ((hedef.yer === "sol" ? r.left : r.right) - 2) + "px"; cizgi.style.top = r.top + "px"; cizgi.style.width = "4px"; cizgi.style.height = r.height + "px"; }
      else { var satirEl = document.querySelector('[data-bolum="' + hedef.id + '"]').parentNode.getBoundingClientRect(); cizgi.style.left = satirEl.left + "px"; cizgi.style.width = satirEl.width + "px"; cizgi.style.height = "4px"; cizgi.style.top = ((hedef.yer === "ust" ? satirEl.top : satirEl.bottom) - 2) + "px"; }
      void kr; void z;
    }
    function bitti() {
      document.removeEventListener("pointermove", hareket); document.removeEventListener("pointerup", bitti); temizle();
      if (!hedef) { S.bolum = id; S.sec = null; S.sekme = "bolum"; kagitCiz(); ayarCiz(); return; }
      var h = hedef; degistir(function () { var b = bolumCikar(id); bolumYerlestir(b, h.id, h.yer); S.bolum = id; S.sec = null; });
      bildir(h.yer === "sol" || h.yer === "sag" ? "Bölüm yan yana alındı" : "Bölüm taşındı");
    }
    document.addEventListener("pointermove", hareket); document.addEventListener("pointerup", bitti);
  }

  /* tablo seçici ızgarası */
  document.addEventListener("pointerover", function (e) {
    var t = e.target.closest("[data-izgara]"); if (!t) return;
    var p = t.dataset.izgara.split("x");
    document.querySelectorAll("[data-izgara]").forEach(function (b) { var q2 = b.dataset.izgara.split("x"); b.classList.toggle("fs-isik", +q2[0] <= +p[0] && +q2[1] <= +p[1]); });
    $("#fs-izgara-not").textContent = p[0] + " satır × " + p[1] + " sütun";
  });

  window.addEventListener("resize", function () { yakinlikUygula(); formOlcekle(); });
  yukle();
  if (q.get("telefon") === "1" || matchMedia("(max-width: 767px)").matches) S.yakin = "0.75";
  S.bolum = bolumler()[1] ? bolumler()[1].id : null; S.sec = { r1: 1, c1: 0, r2: 1, c2: 0 };
  ciz_();
})();
